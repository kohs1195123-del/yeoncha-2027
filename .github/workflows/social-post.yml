name: SNS 자동 게시

on:
  schedule:
    - cron: "0 23 * * *"  # 한국 시간 오전 8시
    - cron: "0 3 * * *"   # 한국 시간 낮 12시
    - cron: "0 9 * * *"   # 한국 시간 오후 6시
    - cron: "0 13 * * *"  # 한국 시간 밤 10시
    - cron: "0 14 * * *"  # 영어 글: 미국 동부 오전 9시
    - cron: "0 22 * * *"  # 영어 글: 미국 동부 오후 5시
    - cron: "30 1 * * *"  # 이슈 글: 한국 시간 오전 10시 반
    - cron: "30 11 * * *" # 이슈 글: 한국 시간 저녁 8시 반
  workflow_dispatch:
    inputs:
      queue:
        description: "ko, en, hot 중 하나"
        default: "ko"

permissions:
  contents: write

concurrency: threads-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 다음 글 올리기
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          QUEUE: ${{ inputs.queue || ((github.event.schedule == '0 14 * * *' || github.event.schedule == '0 22 * * *') && 'en') || ((github.event.schedule == '30 1 * * *' || github.event.schedule == '30 11 * * *') && 'hot') || 'ko' }}
        run: python threads/post_social.py
      - name: 게시 위치 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threads/state.json
          git diff --cached --quiet || (git commit -m "스레드 게시 위치 갱신 [skip ci]" && git push)

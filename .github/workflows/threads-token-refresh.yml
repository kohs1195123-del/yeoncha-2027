name: 스레드 토큰 갱신

# 장기 토큰은 60일마다 만료돼서, 매달 1일과 15일에 갱신해 시크릿을 바꿔 둔다.
# 시크릿을 바꾸려면 GH_PAT(이 저장소의 Secrets 쓰기 권한이 있는 토큰)이 필요하다.
on:
  schedule:
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 갱신
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(curl -sf "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token&access_token=${THREADS_TOKEN}" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$NEW"
          gh secret set THREADS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW"
          echo "토큰을 갱신했어요."

name: 스레드 자동 게시

on:
  schedule:
    - cron: "0 23 * * *"  # 한국 시간 오전 8시
    - cron: "0 9 * * *"   # 한국 시간 오후 6시
  workflow_dispatch:

permissions:
  contents: write

concurrency: threads-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 다음 글 올리기
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python threads/post_threads.py
      - name: 게시 위치 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threads/state.json
          git diff --cached --quiet || (git commit -m "스레드 게시 위치 갱신 [skip ci]" && git push)
